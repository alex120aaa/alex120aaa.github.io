---
layout: archive
title: "Portfolio"
permalink: /portfolio/
author_profile: true
---

{% include base_path %}

<div class="scut-publications-controls">
  <div class="scut-sort-by">
    <span>sort by:</span>
    <select class="scut-sort-select" onchange="sortPortfolio(this.value)">
      <option value="date-desc">date (newest first)</option>
      <option value="date-asc">date (oldest first)</option>
      <option value="title">title (A-Z)</option>
    </select>
  </div>
  <div class="scut-search-results">
    <input type="text" id="portfolioSearch" class="scut-publication-search" placeholder="Search by title..." onkeyup="searchPortfolio(this.value)">
  </div>
</div>

<div class="scut-publications-container" id="portfolioContainer">
  {% for post in site.portfolio %}
    {% include archive-single.html %}
  {% endfor %}
</div>

<div class="scut-pagination">
  <span class="scut-pagination-prev" id="portfolioPrev" onclick="changePortfolioPage(-1)">Previous</span>
  <span class="scut-pagination-page" id="portfolioPageNum">1</span>
  <span class="scut-pagination-next" id="portfolioNext" onclick="changePortfolioPage(1)">Next</span>
  <span class="scut-pagination-info" id="portfolioInfo"></span>
</div>

<script>
var portfolioItemsPerPage = 10;
var portfolioCurrentPage = 1;
var portfolioFilteredItems = [];

function initPortfolioPagination() {
  var container = document.getElementById('portfolioContainer');
  if (!container) return;
  var items = Array.from(container.querySelectorAll('.scut-publication-card'));
  portfolioFilteredItems = items;
  portfolioCurrentPage = 1;
  renderPortfolio();
}

function renderPortfolio() {
  var container = document.getElementById('portfolioContainer');
  if (!container) return;
  var items = portfolioFilteredItems;
  var total = items.length;
  var totalPages = Math.max(1, Math.ceil(total / portfolioItemsPerPage));
  if (portfolioCurrentPage > totalPages) portfolioCurrentPage = totalPages;

  var start = (portfolioCurrentPage - 1) * portfolioItemsPerPage;
  var end = Math.min(start + portfolioItemsPerPage, total);

  items.forEach(function(item, idx) {
    item.style.display = (idx >= start && idx < end) ? '' : 'none';
  });

  var info = document.getElementById('portfolioInfo');
  var pageNum = document.getElementById('portfolioPageNum');
  var prev = document.getElementById('portfolioPrev');
  var next = document.getElementById('portfolioNext');

  if (info) info.textContent = total > 0 ? (start + 1) + '-' + end + ' out of ' + total : '0 out of 0';
  if (pageNum) pageNum.textContent = portfolioCurrentPage;
  if (prev) {
    prev.style.visibility = portfolioCurrentPage <= 1 ? 'hidden' : '';
    prev.style.cursor = portfolioCurrentPage <= 1 ? 'default' : 'pointer';
  }
  if (next) {
    next.style.visibility = portfolioCurrentPage >= totalPages ? 'hidden' : '';
    next.style.cursor = portfolioCurrentPage >= totalPages ? 'default' : 'pointer';
  }
}

function changePortfolioPage(delta) {
  var total = portfolioFilteredItems.length;
  var totalPages = Math.max(1, Math.ceil(total / portfolioItemsPerPage));
  var newPage = portfolioCurrentPage + delta;
  if (newPage < 1 || newPage > totalPages) return;
  portfolioCurrentPage = newPage;
  renderPortfolio();
}

function searchPortfolio(query) {
  query = query.toLowerCase();
  var container = document.getElementById('portfolioContainer');
  if (!container) return;
  var allItems = Array.from(container.querySelectorAll('.scut-publication-card'));
  var filtered = [];
  allItems.forEach(function(item) {
    var title = item.querySelector('.scut-publication-title');
    if (title) {
      var text = title.textContent.toLowerCase();
      var matches = text.includes(query);
      item._portfolioMatch = matches;
      if (matches) filtered.push(item);
    }
  });
  portfolioFilteredItems = filtered;
  portfolioCurrentPage = 1;
  renderPortfolio();
}

function sortPortfolio(sortBy) {
  var container = document.getElementById('portfolioContainer');
  if (!container) return;
  var items = portfolioFilteredItems;
  items.sort(function(a, b) {
    if (sortBy === 'date-desc') {
      var dateA = a.getAttribute('data-date') || '';
      var dateB = b.getAttribute('data-date') || '';
      return dateB.localeCompare(dateA);
    } else if (sortBy === 'date-asc') {
      var dateA = a.getAttribute('data-date') || '';
      var dateB = b.getAttribute('data-date') || '';
      return dateA.localeCompare(dateB);
    } else if (sortBy === 'title') {
      var titleA = (a.getAttribute('data-title') || '').toLowerCase();
      var titleB = (b.getAttribute('data-title') || '').toLowerCase();
      return titleA.localeCompare(titleB);
    }
    return 0;
  });

  var parent = container;
  items.forEach(function(item) {
    parent.appendChild(item);
  });

  portfolioCurrentPage = 1;
  renderPortfolio();
}

document.addEventListener('DOMContentLoaded', function() {
  initPortfolioPagination();
});
</script>
