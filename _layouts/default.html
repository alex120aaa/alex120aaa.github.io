{% include head.html %}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include browser-upgrade.html %}
    {% include masthead.html %}
    <div id="main" class="page__site">
      <div id="content" class="page__content">
        {{ content }}
      </div>
    </div>
    {% include page__footer.html %}
    <script>
      // SCUT fix: neutralise any masthead-driven inline padding on the sidebar.
      // Run immediately so it beats any subsequent JS (greedy-navigation, theme.js, etc).
      (function () {
        function scutCleanup() {
          if (window.jQuery) {
            jQuery("body").css("paddingTop", "").css("paddingBottom", "");
            jQuery(".sidebar").removeAttr("style");
          } else {
            document.body.style.paddingTop = "";
            var sb = document.querySelector(".sidebar");
            if (sb) sb.removeAttribute("style");
          }
        }
        scutCleanup();
        if (document.addEventListener) {
          document.addEventListener("DOMContentLoaded", scutCleanup);
          window.addEventListener("load", scutCleanup);
          window.addEventListener("resize", scutCleanup);
          setInterval(scutCleanup, 200);
        }
      })();
    </script>
    <script type="module" src="{{ base_path }}/assets/js/main.min.js?v=2"></script>
    {% include analytics.html %}
    {% include comments-providers/scripts.html %}
  </body>
</html>
